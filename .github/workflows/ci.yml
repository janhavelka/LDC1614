name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment:
          - esp32s3dev
          - esp32s2dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Cache PlatformIO
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/pip
            ~/.platformio
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini', 'requirements-dev.txt') }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          python -m pip install --requirement requirements-dev.txt

      - name: Build ${{ matrix.environment }}
        run: pio run -e ${{ matrix.environment }}

  native-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Cache PlatformIO
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/pip
            ~/.platformio
          key: ${{ runner.os }}-pio-native-${{ hashFiles('platformio.ini', 'requirements-dev.txt') }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          python -m pip install --requirement requirements-dev.txt

      - name: Enforce core timing guard
        run: python tools/check_core_timing_guard.py

      - name: Run native tests
        run: pio test -e native

  validate-library:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: python -m pip install --requirement requirements-dev.txt

      - name: Enforce example CLI contract
        run: python tools/check_cli_contract.py

      - name: Enforce ESP-IDF example contract
        run: python tools/check_idf_example_contract.py

      - name: Enforce readiness wording contract
        run: python tools/check_readiness_claims.py

      - name: Check repository and documentation hygiene
        run: python tools/check_repository_hygiene.py

      - name: Run HIL runner host tests
        run: python tools/test_ldc1614_hil_runner.py

      - name: Check generated version header
        run: python scripts/generate_version.py check

      - name: Check clean consumer compile
        run: python tools/check_clean_consumer_compile.py

  idf-build:
    name: ESP-IDF build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - esp32s2
          - esp32s3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build native ESP-IDF example
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.0.2
          target: ${{ matrix.target }}
          path: examples/esp_idf/basic

  documentation:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Doxygen
        run: |
          sudo apt-get update
          sudo apt-get install --yes doxygen graphviz

      - name: Generate public documentation
        run: |
          doxygen --version
          doxygen Doxyfile
          test -f docs/doxygen/html/index.html
