[platformio]
src_dir = .
default_envs = esp32s3dev

[env]
; Exact Arduino platform release used by maintained CI and the COM8 HIL path.
; Later upgrades must repeat the LDC combined-write/read NACK recovery test;
; never replace this with the moving `espressif32` registry alias.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino
extra_scripts =
  pre:scripts/generate_version.py
  post:scripts/configure_esptool_upload.py

monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
monitor_filters = send_on_enter, esp32_exception_decoder, colorize
monitor_eol = LF
monitor_echo = yes

upload_speed = 921600

build_flags =
  -Wall
  -Wextra
  -Werror=return-type
  -Iinclude
  -DCORE_DEBUG_LEVEL=0
build_src_filter =
  -<*>
  +<examples/01_basic_bringup_cli/**>
  +<examples/common/**>
  +<examples/esp32/**>
  +<src/**>

debug_tool = esp-prog
debug_init_break = tbreak setup

; -------------------------
; ESP32-S3 dev config
; -------------------------
[env:esp32s3dev]
board = esp32-s3-devkitc-1
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.partitions = default.csv
build_flags =
  ${env.build_flags}
  -DARDUINO_USB_CDC_ON_BOOT=1

; -------------------------
; ESP32-S2 dev config
; -------------------------
[env:esp32s2dev]
board = esp32-s2-saola-1
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.partitions = default.csv
; This fixture uses the ESP32-S2 internal USB CDC upload path. Enter the ROM
; loader with one automatic 1200-baud touch, wait for USB re-enumeration, then
; return directly to the application after upload. No manual reset is needed.
board_upload.use_1200bps_touch = true
board_upload.wait_for_upload_port = true
board_upload.before_reset = no-reset
board_upload.after_reset = hard-reset
build_flags =
  ${env.build_flags}
  -DARDUINO_USB_MODE=0
  -DARDUINO_USB_CDC_ON_BOOT=1

; -------------------------
; Native host tests
; -------------------------
[env:native]
platform = native
framework =
test_framework = unity
test_build_src = true
build_src_filter =
  -<*>
  +<src/**>
  +<examples/common/Ldc1614Cli.cpp>
build_flags =
  -std=c++17
  -Wall
  -Wextra
  -Werror=return-type
  -Iinclude
extra_scripts = pre:scripts/generate_version.py
